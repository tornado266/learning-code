<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>网格上的滚动动态规划</title>
<style>
:root {
  color-scheme: light;
  --background: #f7f7f3;
  --foreground: #172b31;
  --muted: #e7eeea;
  --muted-foreground: #42595d;
  --border: #b6c9c7;
  --card: #ffffff;
  --card-foreground: #172b31;
  --primary: #14676a;
  --primary-foreground: #ffffff;
  --secondary: #dfede9;
  --secondary-foreground: #164f53;
  --accent: #d7eeeb;
  --accent-foreground: #174a4b;
  --destructive: #a93c31;
  --ring: #087b7e;
  --font-size-base: 16px;
  --viz-series-1: #197a77;
  --viz-series-2: #bc532c;
  --viz-series-3: #4b65aa;
  --viz-series-4: #95642b;
  --viz-series-5: #825698;
  --viz-series-6: #587829;
}
* { box-sizing: border-box; }
body { margin: 0; color:var(--foreground); background:var(--background); font: 16px/1.55 system-ui, "Microsoft YaHei", sans-serif; }
main { max-width: 850px; margin: clamp(10px, 5vw, 54px) auto; padding: clamp(14px, 4vw, 34px); background:#fff; }
svg { max-width:100%; height:auto; display:block; }
button, input { font:inherit; }
button { color:var(--foreground); border:1px solid var(--border); background:#fff; padding:7px 14px; border-radius:5px; cursor:pointer; }
button.btn-primary { background:var(--primary); color:white; border-color:var(--primary); }
button:disabled { opacity:.48; cursor:default; }
button:focus-visible, input:focus-visible { outline:3px solid var(--ring); outline-offset:2px; }
.viz-row, .viz-controls { display:flex; flex-wrap:wrap; gap:10px; align-items:center; }
.viz-row { justify-content:space-between; margin-bottom:12px; }
.viz-controls { margin-top:16px; }
.text-small { color:var(--muted-foreground); font-size:.88rem; }
@media (max-width:500px) { main { margin:0; min-height:100vh; } }

</style>
</head>
<body>
<main aria-label="网格上的滚动动态规划">
<div id="grid-rolling-dp-tutor">
  <div class="viz-controls">
    <button type="button" class="btn" data-prev>上一步</button>
    <button type="button" class="btn btn-primary" data-next>下一步</button>
    <span class="tabular-nums" data-step></span>
  </div>
  <p data-state aria-live="polite"></p>
  <svg class="rolling-view" role="img" aria-label="最小路径和的一维数组逐格更新，标明数组中每个答案属于哪一行"></svg>
  <p class="text-small" data-detail></p>
</div>
<style>
#grid-rolling-dp-tutor .rolling-view {display:block;width:100%;height:356px;}
#grid-rolling-dp-tutor .rolling-view text {fill:var(--foreground);font-family:inherit;font-size:var(--font-size-base);text-anchor:middle;dominant-baseline:middle;}
#grid-rolling-dp-tutor [data-state] {margin:12px 0 4px;}
#grid-rolling-dp-tutor [data-detail] {margin:4px 0 0;min-height:2.8em;}
</style>
<script>
(() => {
 const root=document.getElementById('grid-rolling-dp-tutor'), svg=root.querySelector('svg');
 const grid=[[1,3,1],[1,5,1],[4,2,1]], dp=[1,4,5], states=[];
 for(let r=1;r<3;r++)for(let c=0;c<3;c++){
   const up=dp[c],left=c?dp[c-1]:null,value=(c?Math.min(up,left):up)+grid[r][c];
   states.push({r,c,after:false,values:dp.slice(),up,left,value});
   dp[c]=value;
   states.push({r,c,after:true,values:dp.slice(),up,left,value});
 }
 const ns='http://www.w3.org/2000/svg';let index=0,lastWidth=0;
 function add(tag,attrs={},content){const e=document.createElementNS(ns,tag);for(const [k,v] of Object.entries(attrs))e.setAttribute(k,v);if(content!==undefined)e.textContent=content;svg.appendChild(e);return e;}
 function draw(previous){
   const width=root.getBoundingClientRect().width;if(!width)return;lastWidth=width;
   const s=states[index],pitch=Math.min(100,(width-42)/3),x0=(width-pitch*3)/2+10,y0=57;
   svg.setAttribute('viewBox',`0 0 ${width} 356`);svg.replaceChildren();
   add('text',{x:width/2,y:14},'原始代价地图');
   for(let c=0;c<3;c++)add('text',{x:x0+(c+.5)*pitch,y:38},`第 ${c+1} 列`);
   for(let r=0;r<3;r++){
     add('text',{x:x0-17,y:y0+r*37+18},r+1);
     for(let c=0;c<3;c++)add('rect',{x:x0+c*pitch,y:y0+r*37,width:pitch,height:37,fill:'none',stroke:'var(--border)','stroke-width':1});
   }
   const mark=add('rect',{x:0,y:0,width:pitch,height:37,fill:'var(--viz-series-1)','fill-opacity':.2});
   const newX=x0+s.c*pitch,newY=y0+s.r*37;mark.style.transform=`translate(${newX}px,${newY}px)`;
   if(previous&&(previous.r!==s.r||previous.c!==s.c)&&!matchMedia('(prefers-reduced-motion: reduce)').matches){
     mark.animate([{transform:`translate(${x0+previous.c*pitch}px,${y0+previous.r*37}px)`},{transform:`translate(${newX}px,${newY}px)`}],{duration:220,easing:'ease-out'});
   }
   for(let r=0;r<3;r++)for(let c=0;c<3;c++)add('text',{x:x0+(c+.5)*pitch,y:y0+r*37+18},grid[r][c]);
   add('text',{x:width/2,y:200},'仅保留这一行 dp 数组');
   for(let c=0;c<3;c++){
     const x=x0+c*pitch,updated=c<s.c||(s.after&&c===s.c),owner=updated?s.r+1:s.r;
     add('text',{x:x+pitch/2,y:229},`第 ${c+1} 列`);
     add('rect',{x:x+4,y:246,width:pitch-8,height:44,rx:5,fill:updated?'var(--viz-series-1)':'var(--muted)','fill-opacity':updated?.2:1});
     add('text',{x:x+pitch/2,y:268},s.values[c]);
     add('text',{x:x+pitch/2,y:310},`第 ${owner} 行答案`);
     if(c===s.c)add('text',{x:x+pitch/2,y:336},s.after?'已覆盖':'待覆盖');
   }
   root.querySelector('[data-state]').textContent=`${s.after?'已写入':'待计算'}：第 ${s.r+1} 行，第 ${s.c+1} 列`;
   root.querySelector('[data-detail]').textContent=`上方旧值 ${s.up} · ${s.c?'左方新值 '+s.left:'第一列，无左方'} · 本格代价 ${grid[s.r][s.c]}`+(s.after?` · 写入 ${s.value}`:'');
   root.querySelector('[data-step]').textContent=`${index+1} / ${states.length}`;
   root.querySelector('[data-prev]').disabled=index===0;root.querySelector('[data-next]').disabled=index===states.length-1;
   svg.setAttribute('aria-label',root.querySelector('[data-state]').textContent+'。数组：'+s.values.join('、')+'。'+root.querySelector('[data-detail]').textContent);
 }
 root.querySelector('[data-prev]').addEventListener('click',()=>{if(index>0){const old=states[index];index--;draw(old);}});
 root.querySelector('[data-next]').addEventListener('click',()=>{if(index<states.length-1){const old=states[index];index++;draw(old);}});
 new ResizeObserver(()=>{if(Math.abs(root.getBoundingClientRect().width-lastWidth)>1)draw();}).observe(root);draw();
})();
</script>
</main>
</body>
</html>
